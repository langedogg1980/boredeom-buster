  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rape */\n    --either-2: #ffd400;  /* yellow */\n\n    --stroke: 4px;\n    --stroke-thick: 6px;\n    --r-blob: 28px;\n  }\n\n  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    font-family: \"Fredoka One\", \"Boogaloo\", system-ui, sans-serif;\n    color: var(--ink);\n    background: var(--paper);\n    min-height: 100svh;\n    overflow-x: hidden;\n    overscroll-behavior-y: contain;\n    -webkit-font-smoothing: antialiased;\n  }\n\n  /* ============ DOODLE BACKGROUND ============ */\n  .doodle-bg {\n    position: fixed;\n    inset: 0;\n    z-index: 0;\n    pointer-events: none;\n    background-color: var(--paper);\n    background-image:\n      /* squiggle */\n      url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%230e0e10' stroke-width='3' stroke-linecap='round'><path d='M10 30 q10 -10 20 0 t20 0 t20 0 t20 0'/><circle cx='95' cy='75' r='6'/><path d='M20 90 l8 -8 M28 90 l-8 -8'/><path d='M70 20 l4 -8 M74 12 l4 8 M78 20 l4 -8' /><path d='M55 105 q5 -6 10 0' /><\u002Fg><\u002Fsvg>\"),\n      /* stars + dots */\n      url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><g fill='%230e0e10'><circle cx='20' cy='20' r='3'/><circle cx='150' cy='40' r='2.5'/><circle cx='90' cy='150' r='3'/><\u002Fg><g fill='none' stroke='%230e0e10' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M120 100 l4 -10 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4z' fill='%23ffd400'/><path d='M40 110 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3z' fill='%23ff5a5f'/><\u002Fg><\u002Fsvg>\");\n    background-size: 240px 240px, 360px 360px;\n    background-position: 0 0, 40px 60px;\n    opacity: .55;\n    animation: drift 40s linear infinite;\n  }\n  @keyframes drift {\n    0%   { background-position: 0 0, 40px 60px; }\n    100% { background-position: 240px 240px, 400px 420px; }\n  }\n  .doodle-bg::after {\n    content: \"\";\n    position: absolute; inset: 0;\n    background:\n      radial-gradient(ellipse at 20% 0%, rgba(76,201,240,.25), transparent 50%),\n      radial-gradient(ellipse at 90% 30%, rgba(255,90,95,.20), transparent 50%),\n      radial-gradient(ellipse at 50% 100%, rgba(174,243,89,.30), transparent 55%);\n  }\n\n  /* ============ APP SHELL ============ */\n  .app {\n    position: relative;\n    z-index: 1;\n    max-width: 480px;\n    margin: 0 auto;\n    padding: 18px 18px 40px;\n    min-height: 100svh;\n    display: flex;\n    flex-direction: column;\n    gap: 18px;\n  }\n\n  /* ============ HEADER ============ */\n  .topbar {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 10px;\n  }\n  .wordmark {\n    font-family: \"Bungee\", \"Fredoka One\", sans-serif;\n    font-size: 26px;\n    line-height: 1;\n    letter-spacing: -.5px;\n    background: var(--ink);\n    color: var(--yellow);\n    padding: 10px 14px 8px;\n    border-radius: 14px;\n    border: var(--stroke) solid var(--ink);\n    box-shadow: 4px 4px 0 var(--ink);\n    transform: rotate(-3deg);\n  }\n  .wordmark .b1 { color: var(--coral); }\n  .wordmark .b2 { color: var(--lime); }\n  .wordmark .b3 { color: var(--sky); }\n\n  /* weather chip */\n  .weather {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    background: #fff;\n    border: var(--stroke) solid var(--ink);\n    border-radius: 999px;\n    padding: 8px 14px 6px 10px;\n    box-shadow: 3px 3px 0 var(--ink);\n    transform: rotate(2deg);\n    font-family: \"Boogaloo\", sans-serif;\n    font-size: 18px;\n    min-height: 44px;\n  }\n  .weather .ico {\n    font-size: 22px;\n    display: inline-block;\n    transform: translateY(-1px);\n  }\n  .weather .temp { font-weight: 700; }\n  .weather .lbl {\n    font-family: \"Space Mono\", monospace;\n    font-size: 10px;\n    letter-spacing: 1px;\n    color: #555;\n    text-transform: uppercase;\n    margin-left: 4px;\n  }\n\n  /* ============ KID SELECTOR ============ */\n  .kids {\n    display: grid;\n    grid-template-columns: 1fr 1fr 1fr;\n    gap: 8px;\n    background: #fff;\n    border: var(--stroke) solid var(--ink);\n    border-radius: 22px;\n    padding: 6px;\n    box-shadow: 5px 5px 0 var(--ink);\n    position: relative;\n  }\n  .kid-btn {\n    appearance: none;\n    -webkit-appearance: none;\n    border: none;\n    background: transparent;\n    padding: 14px 6px 12px;\n    font-family: \"Fredoka One\", sans-serif;\n    font-size: 18px;\n    color: var(--ink);\n    border-radius: 16px;\n    cursor: pointer;\n    min-height: 52px;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 2px;\n    line-height: 1;\n    transition: transform .15s ease;\n    position: relative;\n  }\n  .kid-btn .emoji {\n    font-size: 22px;\n    line-height: 1;\n  }\n  .kid-btn .name { letter-spacing: .5px; }\n  .kid-btn[aria-pressed=\"true\"] {\n    color: var(--ink);\n    box-shadow: inset 0 0 0 3px var(--ink);\n    transform: translateY(-2px) rotate(-1deg);\n  }\n  .kid-btn[data-kid=\"colin\"][aria-pressed=\"true\"]  { background: var(--colin); }\n  .kid-btn[data-kid=\"miles\"][aria-pressed=\"true\"]  { background: var(--miles); color: #fff; }\n  .kid-btn[data-kid=\"either\"][aria-pressed=\"true\"] { background: var(--either); color:#fff; }\n  .kid-btn:active { transform: translateY(1px) scale(.97); }\n\n  /* ============ INDOOR BANNER ============ */\n  .indoor-banner {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 8px;\n    background: var(--sky);\n    border: var(--stroke) solid var(--ink);\n    border-radius: 16px;\n    padding: 10px 14px 8px;\n    font-family: \"Boogaloo\", sans-serif;\n    font-size: 17px;\n    letter-spacing: .5px;\n    box-shadow: 4px 4px 0 var(--ink);\n    transform: rotate(-1deg);\n    animation: bannerPop .4s cubic-bezier(.2,1.5,.4,1) 1;\n  }\n  .indoor-banner[hidden] { display: none; }\n  .indoor-banner .ib-ico { font-size: 20px; }\n  @keyframes bannerPop {\n    0%   { transform: rotate(-1deg) scale(.6); opacity: 0; }\n    100% { transform: rotate(-1deg) scale(1);  opacity: 1; }\n  }\n\n  /* tappable weather chip cue */\n  .weather { cursor: pointer; user-select: none; }\n  .weather:active { transform: rotate(2deg) scale(.94); }\n\n  /* ============ HERO BORED BUTTON ============ */\n  .stage {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    gap: 18px;\n    padding: 10px 0 0;\n    min-height: 360px;\n    position: relative;\n  }\n  .hero-wrap {\n    position: relative;\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    width: 100%;\n  }\n  .bored-btn {\n    appearance: none;\n    -webkit-appearance: none;\n    border: var(--stroke-thick) solid var(--ink);\n    background: var(--yellow);\n    color: var(--ink);\n    font-family: \"Bungee\", \"Fredoka One\", sans-serif;\n    font-size: clamp(48px, 14vw, 72px);\n    line-height: .9;\n    letter-spacing: -1px;\n    padding: 38px 28px 30px;\n    border-radius: 50% 46% 52% 48% / 48% 52% 46% 54%;\n    width: min(82vw, 340px);\n    height: min(82vw, 340px);\n    box-shadow:\n      0 0 0 0 var(--ink),\n      10px 10px 0 var(--ink);\n    cursor: pointer;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    text-align: center;\n    animation: wobble 2.2s ease-in-out infinite;\n    transform-origin: center;\n    text-shadow: 3px 3px 0 #fff;\n    position: relative;\n    z-index: 2;\n  }\n  .bored-btn .small {\n    font-family: \"Boogaloo\", sans-serif;\n    font-size: 22px;\n    text-shadow: none;\n    margin-top: 6px;\n    letter-spacing: 1px;\n    color: var(--ink);\n    opacity: .85;\n  }\n  .bored-btn:active {\n    transform: scale(.95) rotate(-2deg);\n    box-shadow: 4px 4px 0 var(--ink);\n  }\n  @keyframes wobble {\n    0%, 100% { transform: rotate(-3deg) scale(1); }\n    25%      { transform: rotate(2deg)  scale(1.03); }\n    50%      { transform: rotate(-2deg) scale(.98); }\n    75%      { transform: rotate(3deg)  scale(1.02); }\n  }\n  .bored-btn.smash {\n    animation: smash .55s cubic-bezier(.3,1.6,.5,1) 1;\n  }\n  @keyframes smash {\n    0%   { transform: scale(1) rotate(0); }\n    35%  { transform: scale(1.18) rotate(-6deg); }\n    70%  { transform: scale(.82) rotate(5deg); }\n    100% { transform: scale(1) rotate(0); }\n  }\n\n  /* floating tags around the hero */\n  .float-tag {\n    position: absolute;\n    font-family: \"Boogaloo\", sans-serif;\n    background: #fff;\n    color: var(--ink);\n    border: var(--stroke) solid var(--ink);\n    border-radius: 14px;\n    padding: 6px 10px 4px;\n    font-size: 16px;\n    box-shadow: 3px 3px 0 var(--ink);\n    z-index: 3;\n    pointer-events: none;\n  }\n  .ft-1 { top: 4px; left: 0; background: var(--coral); color: #fff; transform: rotate(-10deg); }\n  .ft-2 { top: 30px; right: 0; background: var(--lime); transform: rotate(8deg); }\n  .ft-3 { bottom: 0; left: 14px; background: var(--sky); transform: rotate(6deg); }\n  .ft-4 { bottom: 18px; right: 10px; background: var(--hot-pink); color:#fff; transform: rotate(-7deg); }\n\n  /* ============ ACTIVITY CARD ============ */\n  .card {\n    position: relative;\n    width: min(86vw, 360px);\n    border: var(--stroke-thick) solid var(--ink);\n    border-radius: var(--r-blob);\n    background: #fff;\n    padding: 22px 22px 18px;\n    box-shadow: 8px 8px 0 var(--ink);\n    text-align: center;\n    transform-origin: center;\n  }\n  .card[hidden] { display: none !important; }\n  .card.flip-in {\n    animation: flipIn .7s cubic-bezier(.2,1.4,.3,1) 1;\n  }\n  @keyframes flipIn {\n    0%   { transform: rotateX(90deg) scale(.4) rotate(-12deg); opacity: 0; }\n    60%  { transform: rotateX(-10deg) scale(1.05) rotate(4deg); opacity: 1; }\n    100% { transform: rotateX(0)    scale(1)   rotate(-2deg); opacity: 1; }\n  }\n  .card .ribbon {\n    position: absolute;\n    top: -18px;\n    left: 50%;\n    transform: translateX(-50%) rotate(-3deg);\n    background: var(--ink);\n    color: var(--yellow);\n    font-family: \"Bungee\", sans-serif;\n    font-size: 14px;\n    padding: 6px 14px 4px;\n    border-radius: 10px;\n    border: 3px solid var(--ink);\n    letter-spacing: 1px;\n    white-space: nowrap;\n  }\n  .card .tag {\n    display: inline-block;\n    font-family: \"Boogaloo\", sans-serif;\n    font-size: 14px;\n    background: var(--lime);\n    border: 3px solid var(--ink);\n    border-radius: 999px;\n    padding: 4px 10px 2px;\n    margin-bottom: 8px;\n    transform: rotate(-2deg);\n  }\n  .card .emoji-big {\n    font-size: 64px;\n    line-height: 1;\n    display: block;\n    margin: 4px 0 6px;\n    animation: bounce 1.6s ease-in-out infinite;\n  }\n  @keyframes bounce {\n    0%, 100% { transform: translateY(0) rotate(-4deg); }\n    50%      { transform: translateY(-8px) rotate(5deg); }\n  }\n  .card .title {\n    font-family: \"Fredoka One\", sans-serif;\n    font-size: 30px;\n    line-height: 1.05;\n    margin: 4px 0 8px;\n    text-wrap: balance;\n  }\n  .card .blurb {\n    font-family: \"Boogaloo\", sans-serif;\n    font-size: 18px;\n    color: #2a2a2e;\n    margin: 0 0 16px;\n    text-wrap: pretty;\n  }\n  .card .who {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    font-family: \"Space Mono\", monospace;\n    font-size: 11px;\n    letter-spacing: 1px;\n    text-transform: uppercase;\n    color: #555;\n  }\n  .card .who .dot {\n    width: 10px; height: 10px; border-radius: 50%;\n    border: 2px solid var(--ink);\n    display: inline-block;\n  }\n\n  /* re-roll button */\n  .reroll {\n    appearance: none;\n    -webkit-appearance: none;\n    border: var(--stroke) solid var(--ink);\n    background: var(--coral);\n    color: #fff;\n    font-family: \"Bungee\", sans-serif;\n    font-size: 18px;\n    padding: 14px 18px 12px;\n    border-radius: 18px 22px 18px 22px / 22px 18px 22px 18px;\n    box-shadow: 5px 5px 0 var(--ink);\n    cursor: pointer;\n    letter-spacing: 1px;\n    min-height: 52px;\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    transform: rotate(-1.5deg);\n    transition: transform .15s ease, box-shadow .15s ease;\n  }\n  .reroll:hover { transform: rotate(-1.5deg) translateY(-2px); }\n  .reroll:active { transform: rotate(-1.5deg) translate(2px, 3px); box-shadow: 2px 2px 0 var(--ink); }\n  .reroll[hidden] { display: none; }\n  .reroll .arrow {\n    display: inline-block;\n    animation: spinArrow 2s linear infinite;\n  }\n  @keyframes spinArrow {\n    to { transform: rotate(360deg); }\n  }\n\n  /* ============ CONFETTI ============ */\n  .confetti-layer {\n    position: fixed;\n    inset: 0;\n    pointer-events: none;\n    z-index: 50;\n    overflow: hidden;\n  }\n  .confetti {\n    position: absolute;\n    width: 14px;\n    height: 14px;\n    will-change: transform, opacity;\n  }\n  .confetti.sq { border-radius: 3px; }\n  .confetti.ci { border-radius: 50%; }\n  .confetti.st {\n    width: 18px; height: 18px;\n    background: transparent !important;\n    color: var(--yellow);\n    font-size: 22px;\n    line-height: 1;\n    font-family: sans-serif;\n  }\n  .confetti.st::before { content: \"★\"; }\n\n  /* ============ FOOTER STAMP ============ */\n  .stamp {\n    text-align: center;\n    font-family: \"Space Mono\", monospace;\n    font-size: 10px;\n    letter-spacing: 2px;\n    color: #6a6a6e;\n    margin-top: auto;\n    padding-top: 12px;\n    text-transform: uppercase;\n  }\n  .stamp .blob {\n    display: inline-block;\n    padding: 6px 10px 4px;\n    border: 2px dashed var(--ink);\n    border-radius: 10px;\n    transform: rotate(-1deg);\n    background: rgba(255,255,255,.5);\n  }\n\n  /* ============ SR ONLY ============ */\n  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }\n\n  /* tweak for tiny phones */\n  @media (max-height: 700px) {\n    .stage { min-height: 320px; }\n    .bored-btn { width: min(70vw, 280px); height: min(70vw, 280px); font-size: clamp(40px, 12vw, 60px); }\n    .card .emoji-big { font-size: 52px; }\n    .card .title { font-size: 26px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  <div class=\"doodle-bg\" aria-hidden=\"true\"><\u002Fdiv>\n\n  <main class=\"app\" data-screen-label=\"Boredom Buster\">\n    <!-- HEADER -->\n    <header class=\"topbar\">\n      <div class=\"wordmark\" aria-label=\"Boredom Buster\">\n        <span class=\"b1\">B<\u002Fspan><span class=\"b2\">O<\u002Fspan><span class=\"b3\">R<\u002Fspan>ED?!\n      <\u002Fdiv>\n      <div class=\"weather\" id=\"weather\" aria-live=\"polite\" title=\"Lincoln, NE 68516\">\n        <span class=\"ico\" id=\"wIco\">⛅<\u002Fspan>\n        <span class=\"temp\" id=\"wTemp\">--°<\u002Fspan>\n        <span class=\"lbl\">LNK<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- KID SELECTOR -->\n    <nav class=\"kids\" role=\"tablist\" aria-label=\"Who's bored?\">\n      <button class=\"kid-btn\" data-kid=\"colin\" role=\"tab\" aria-pressed=\"false\">\n        <span class=\"emoji\">🎸<\u002Fspan><span class=\"name\">COLIN<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"kid-btn\" data-kid=\"miles\" role=\"tab\" aria-pressed=\"false\">\n        <span class=\"emoji\">⚾<\u002Fspan><span class=\"name\">MILES<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"kid-btn\" data-kid=\"either\" role=\"tab\" aria-pressed=\"true\">\n        <span class=\"emoji\">🤝<\u002Fspan><span class=\"name\">EITHER<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fnav>\n\n    <div class=\"indoor-banner\" id=\"indoorBanner\" hidden=\"\">\n      <span class=\"ib-ico\">🌧️<\u002Fspan> RAINY DAY = INDOOR PICKS ONLY!\n    <\u002Fdiv>\n\n    <!-- STAGE -->\n    <section class=\"stage\" id=\"stage\">\n      <div class=\"hero-wrap\" id=\"heroWrap\">\n        <span class=\"float-tag ft-1\">PRESS ME!<\u002Fspan>\n        <span class=\"float-tag ft-2\">★ WOW ★<\u002Fspan>\n        <span class=\"float-tag ft-3\">DO IT<\u002Fspan>\n        <span class=\"float-tag ft-4\">!!!<\u002Fspan>\n\n        <button class=\"bored-btn\" id=\"boredBtn\" aria-label=\"I'm bored, give me something to do\">\n          I'M<br>BORED\n          <span class=\"small\">tap to bust it<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <article class=\"card\" id=\"card\" hidden=\"\" aria-live=\"polite\">\n        <span class=\"ribbon\">YOUR MISSION<\u002Fspan>\n        <span class=\"tag\" id=\"cTag\">indoor<\u002Fspan>\n        <span class=\"emoji-big\" id=\"cEmoji\">🎯<\u002Fspan>\n        <h2 class=\"title\" id=\"cTitle\">Build a LEGO masterpiece<\u002Fh2>\n        <p class=\"blurb\" id=\"cBlurb\">Pick a tub, dump it out, no plans — just chaos engineering.<\u002Fp>\n        <span class=\"who\"><span class=\"dot\" id=\"cDot\"><\u002Fspan><span id=\"cWho\">For Colin<\u002Fspan><\u002Fspan>\n      <\u002Farticle>\n\n      <button class=\"reroll\" id=\"reroll\" hidden=\"\">\n        <span class=\"arrow\">🔄<\u002Fspan> TRY ANOTHER ONE\n      <\u002Fbutton>\n    <\u002Fsection>\n\n    <footer class=\"stamp\">\n      <span class=\"blob\">made for Colin &amp; Miles · est. summer · Lincoln NE<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fmain>\n\n  <div class=\"confetti-layer\" id=\"confetti\" aria-hidden=\"true\"><\u002Fdiv>\n\n  <script>\n  /* ============================================================\n     BOREDOM BUSTER — vanilla JS\n     ============================================================ */\n\n  // ---------- ACTIVITY POOLS ----------\n  // tags: indoor | outdoor | either\n  const ACTIVITIES = {\n    colin: [\n      { t:\"Build a LEGO MEGA-FORT\", e:\"🧱\", b:\"No instructions allowed. The weirder, the cooler.\", tag:\"indoor\" },\n      { t:\"Draw your own manga page\", e:\"✏️\", b:\"One page. One hero. Bonus points for sound effects (KAPOW!).\", tag:\"indoor\" },\n      { t:\"BEAT your high score\", e:\"🎮\", b:\"Pick a game and don't stop 'til you've crushed your record.\", tag:\"indoor\" },\n      { t:\"Play guitar for 20 min\", e:\"🎸\", b:\"Learn one new riff. Loud is the only volume.\", tag:\"indoor\" },\n      { t:\"Invent a smoothie\", e:\"🥤\", b:\"3+ ingredients. Name it something ridiculous.\", tag:\"indoor\" },\n      { t:\"Build a backyard obstacle course\", e:\"🏃\", b:\"Use what's outside. Time yourself. Beat that time.\", tag:\"outdoor\" },\n      { t:\"Stop-motion LEGO movie\", e:\"🎬\", b:\"30 frames. A tiny plot. Action!\", tag:\"indoor\" },\n      { t:\"Design a manga villain\", e:\"😈\", b:\"Backstory + signature move. Make them awful.\", tag:\"indoor\" },\n      { t:\"Speedrun a level\", e:\"⚡\", b:\"Pick one level. Optimize. Become unstoppable.\", tag:\"indoor\" },\n      { t:\"Write a guitar song\", e:\"🎼\", b:\"4 chords, dumb lyrics, total banger.\", tag:\"indoor\" },\n      { t:\"Smoothie taste-test challenge\", e:\"🍓\", b:\"Make 3. Blind taste-test with Miles. Loser cleans up.\", tag:\"indoor\" },\n      { t:\"LEGO speed-build race\", e:\"⏱️\", b:\"Same set, two builders. Fastest wins glory.\", tag:\"indoor\" },\n      { t:\"Hit the pool\", e:\"🏊\", b:\"Cannonballs, handstands, breath-holding contest. GO.\", tag:\"outdoor\" },\n      { t:\"Underwater treasure dive\", e:\"🤿\", b:\"Toss stuff in the deep end. Race to grab it all.\", tag:\"outdoor\" },\n    ],\n    miles: [\n      { t:\"Make a video\", e:\"🎥\", b:\"Pick a topic. 60 seconds. Edit it like a pro.\", tag:\"indoor\" },\n      { t:\"Bake something sweet\", e:\"🧁\", b:\"Cookies? Brownies? Mystery banana bread? GO.\", tag:\"indoor\" },\n      { t:\"Go for a bike ride\", e:\"🚴\", b:\"New route. Find something you've never seen before.\", tag:\"outdoor\" },\n      { t:\"Baseball swing practice\", e:\"⚾\", b:\"50 swings. Focus on follow-through. No phone.\", tag:\"outdoor\" },\n      { t:\"Swim laps or splash session\", e:\"🏊\", b:\"30 minutes in the water. Cannonballs encouraged.\", tag:\"outdoor\" },\n      { t:\"Go fishing\", e:\"🎣\", b:\"Grab a pole. Pick a spot. Patience = points.\", tag:\"outdoor\" },\n      { t:\"Film a movie trailer\", e:\"🎞️\", b:\"For a movie that doesn't exist. Make it epic.\", tag:\"indoor\" },\n      { t:\"Bake a weird cookie\", e:\"🍪\", b:\"Add something nobody adds. Pretzels? Cereal? Yes.\", tag:\"indoor\" },\n      { t:\"Bike scavenger hunt\", e:\"🗺️\", b:\"Find 5 things in the neighborhood. Photo proof.\", tag:\"outdoor\" },\n      { t:\"Home run derby\", e:\"💥\", b:\"Wiffle ball + tee. How many can you launch?\", tag:\"outdoor\" },\n      { t:\"Pool game tournament\", e:\"🏆\", b:\"Marco polo, sharks, diving for stuff. Bracket-style.\", tag:\"outdoor\" },\n      { t:\"Tie your own lure\", e:\"🪝\", b:\"Use random stuff. Test it next time you fish.\", tag:\"indoor\" },\n      { t:\"Diving board tricks\", e:\"🤸\", b:\"Invent 3 new dives. Rate each one out of 10.\", tag:\"outdoor\" },\n      { t:\"Pool lap challenge\", e:\"🏊\", b:\"How many laps without stopping? Beat it tomorrow.\", tag:\"outdoor\" },\n    ],\n    either: [\n      { t:\"DRAWING BATTLE!\", e:\"⚔️\", b:\"5 min timer, same subject, no peeking. Mom judges.\", tag:\"indoor\" },\n      { t:\"Documentary + Quiz Showdown\", e:\"🧠\", b:\"Watch one together. Make 5 questions. Lowest score does dishes.\", tag:\"indoor\" },\n      { t:\"Build each other a scavenger hunt\", e:\"🔍\", b:\"10 clues. No going outside without telling someone.\", tag:\"either\" },\n      { t:\"Bike to adventure golf\", e:\"⛳\", b:\"Helmets on. Trash talk allowed. Loser buys ice cream.\", tag:\"outdoor\" },\n      { t:\"Film a fake commercial\", e:\"📺\", b:\"For a thing in your house. The dumber the product, the better.\", tag:\"indoor\" },\n      { t:\"Invent a new sport\", e:\"🏐\", b:\"Rules. A name. A weird scoring system. Play it.\", tag:\"either\" },\n      { t:\"Lava floor challenge\", e:\"🌋\", b:\"Couch cushions only. No feet on the floor. 5 minutes.\", tag:\"indoor\" },\n      { t:\"Brother vs. brother bake-off\", e:\"🥧\", b:\"Same 5 ingredients. Make something different. Family judges.\", tag:\"indoor\" },\n      { t:\"Backwards day\", e:\"🔄\", b:\"Eat dessert first, walk backwards, wear shirts inside out. Commit.\", tag:\"either\" },\n      { t:\"Two-player podcast\", e:\"🎙️\", b:\"Record 5 minutes. Pick a topic neither of you knows about.\", tag:\"indoor\" },\n      { t:\"Sidewalk chalk mural\", e:\"🎨\", b:\"Whole driveway. One giant scene. Sign it.\", tag:\"outdoor\" },\n      { t:\"Make a hot sauce\", e:\"🌶️\", b:\"Mix stuff from the fridge. Dare each other to taste.\", tag:\"indoor\" },\n      { t:\"Swim sesh — bros vs. pool\", e:\"🏊\", b:\"Marco polo, sharks & minnows, breath-hold contest. Winner picks dinner.\", tag:\"outdoor\" },\n      { t:\"Walk to Taco Bell\", e:\"🌮\", b:\"On foot. Order something weird. Rate it on the walk home.\", tag:\"outdoor\" },\n      { t:\"Bike to Raising Cane's\", e:\"🐔\", b:\"Helmets on. Sauce ranking required when you get back.\", tag:\"outdoor\" },\n      { t:\"Bike to Humann Elementary\", e:\"🏫\", b:\"Hit the playground. Re-live your tiny-kid era.\", tag:\"outdoor\" },\n      { t:\"SLIP N SLIDE\", e:\"💦\", b:\"Set it up. Soap it up. Belly flops only.\", tag:\"outdoor\" },\n      { t:\"Monopoly grudge match\", e:\"🎩\", b:\"Full game. No quitting when you start losing. RULES.\", tag:\"indoor\" },\n      { t:\"Chess showdown\", e:\"♟️\", b:\"Best of 3. Loser sets the board next time.\", tag:\"indoor\" },\n      { t:\"Game of Life\", e:\"🎲\", b:\"Pick your career, marry a peg, pay your bills. Classic.\", tag:\"indoor\" },\n      { t:\"402 Creamery run\", e:\"🍦\", b:\"Walk or bike. Try a flavor you've never had. No takebacks.\", tag:\"outdoor\" },\n    ],\n  };\n\n  // ---------- STATE ----------\n  const state = {\n    kid: \"either\",       // colin | miles | either\n    weatherCode: null,\n    temp: null,\n    weatherIndoor: false, // computed from weathercode (true = rain/storm/snow)\n    override: \"auto\",     // auto | indoor | outdoor  (tap weather chip to cycle)\n    lastIdx: { colin: -1, miles: -1, either: -1 },\n  };\n\n  // resolves whether outdoor activities are allowed right now\n  function indoorOnly() {\n    if (state.override === \"indoor\")  return true;\n    if (state.override === \"outdoor\") return false;\n    return state.weatherIndoor; // auto -> follow the weather\n  }\n\n  // ---------- DOM ----------\n  const $ = (sel) => document.querySelector(sel);\n  const els = {\n    kidBtns: document.querySelectorAll(\".kid-btn\"),\n    boredBtn: $(\"#boredBtn\"),\n    card: $(\"#card\"),\n    cTitle: $(\"#cTitle\"),\n    cBlurb: $(\"#cBlurb\"),\n    cEmoji: $(\"#cEmoji\"),\n    cTag: $(\"#cTag\"),\n    cWho: $(\"#cWho\"),\n    cDot: $(\"#cDot\"),\n    reroll: $(\"#reroll\"),\n    confetti: $(\"#confetti\"),\n    heroWrap: $(\"#heroWrap\"),\n    wIco: $(\"#wIco\"),\n    wTemp: $(\"#wTemp\"),\n    weather: $(\"#weather\"),\n    indoorBanner: $(\"#indoorBanner\"),\n  };\n\n  // ---------- KID SWITCHER ----------\n  els.kidBtns.forEach(btn => {\n    btn.addEventListener(\"click\", () => {\n      const kid = btn.dataset.kid;\n      state.kid = kid;\n      els.kidBtns.forEach(b => b.setAttribute(\"aria-pressed\", b === btn));\n      // re-color hero\n      const color = kid === \"colin\" ? \"var(--colin)\"\n                  : kid === \"miles\" ? \"var(--miles)\"\n                  : \"var(--either)\";\n      const text = kid === \"miles\" ? \"#fff\" : (kid === \"either\" ? \"#fff\" : \"var(--ink)\");\n      els.boredBtn.style.background = color;\n      els.boredBtn.style.color = text;\n      els.boredBtn.style.textShadow = (kid === \"miles\" || kid === \"either\")\n        ? \"3px 3px 0 rgba(0,0,0,.25)\"\n        : \"3px 3px 0 #fff\";\n      // little wobble on switch\n      els.boredBtn.classList.remove(\"smash\");\n      void els.boredBtn.offsetWidth;\n      els.boredBtn.classList.add(\"smash\");\n    });\n  });\n\n  // ---------- WEATHER ----------\n  function weatherEmoji(code) {\n    if (code == null) return \"❓\";\n    if (code === 0) return \"☀️\";\n    if ([1,2].includes(code)) return \"🌤️\";\n    if (code === 3) return \"☁️\";\n    if ([45,48].includes(code)) return \"🌫️\";\n    if (code >= 51 && code <= 57) return \"🌦️\";\n    if (code >= 61 && code <= 67) return \"🌧️\";\n    if (code >= 71 && code <= 77) return \"❄️\";\n    if (code >= 80 && code <= 82) return \"🌧️\";\n    if (code >= 95) return \"⛈️\";\n    return \"🌥️\";\n  }\n  function weatherLabel(code) {\n    if (code == null) return \"—\";\n    if (code === 0) return \"SUNNY\";\n    if ([1,2].includes(code)) return \"PARTLY\";\n    if (code === 3) return \"CLOUDY\";\n    if (code >= 61 && code <= 67) return \"RAINY\";\n    if (code >= 80 && code <= 82) return \"SHOWERS\";\n    if (code >= 95) return \"STORMY\";\n    if (code >= 71 && code <= 77) return \"SNOW\";\n    return \"MEH\";\n  }\n\n  async function fetchWeather(attempt = 1) {\n    const MAX = 3;\n    if (state.override === \"auto\") {\n      els.wIco.textContent = \"⏳\";\n      els.wTemp.textContent = \"…\";\n      els.weather.title = \"Checking the sky… (tap to force indoor/outdoor)\";\n    }\n    try {\n      const ctrl = new AbortController();\n      const timer = setTimeout(() => ctrl.abort(), 4500);\n      const r = await fetch(\n        \"https://api.open-meteo.com/v1/forecast?latitude=40.7819&longitude=-96.6044&current_weather=true&temperature_unit=fahrenheit\",\n        { signal: ctrl.signal, cache: \"no-store\" }\n      );\n      clearTimeout(timer);\n      if (!r.ok) throw new Error(\"HTTP \" + r.status);\n      const j = await r.json();\n      const cw = j.current_weather || {};\n      state.weatherCode = cw.weathercode ?? null;\n      state.temp = cw.temperature ?? null;\n      // rain (61-67), showers (80-82), snow (71-77), storm (95+) => indoor weather\n      state.weatherIndoor = (state.weatherCode != null &&\n        ((state.weatherCode >= 61 && state.weatherCode <= 86) || state.weatherCode >= 95));\n      state.weatherOk = true;\n      if (state.override === \"auto\") renderWeather();\n      else els.indoorBanner.hidden = !indoorOnly();\n    } catch (e) {\n      console.warn(\"weather fetch failed (attempt \" + attempt + \")\", e);\n      if (attempt < MAX) {\n        setTimeout(() => fetchWeather(attempt + 1), attempt * 800);\n        return;\n      }\n      // gave up: show retry state (only if user is on auto), leave override available\n      state.weatherOk = false;\n      if (state.override === \"auto\") {\n        els.wIco.textContent = \"🔄\";\n        els.wTemp.textContent = \"tap\";\n        els.weather.title = \"Couldn't reach the weather — tap to force 🏠 indoor / 🌞 outdoor\";\n      }\n    }\n  }\n\n  // paints the chip from current state + override\n  function renderWeather() {\n    const ov = state.override;\n    if (ov === \"indoor\") {\n      els.wIco.textContent = \"🏠\";\n      els.wTemp.textContent = \"INSIDE\";\n      els.weather.title = \"Forced INDOOR — tap to change\";\n    } else if (ov === \"outdoor\") {\n      els.wIco.textContent = \"🌞\";\n      els.wTemp.textContent = \"OUTSIDE\";\n      els.weather.title = \"Forced OUTDOOR — tap to change\";\n    } else {\n      // auto: reflect real weather\n      els.wIco.textContent = state.weatherOk ? weatherEmoji(state.weatherCode) : \"🔄\";\n      els.wTemp.textContent = (state.weatherOk && state.temp != null) ? Math.round(state.temp) + \"°\" : \"retry\";\n      els.weather.title = state.weatherOk\n        ? `Lincoln, NE — ${weatherLabel(state.weatherCode)}${state.temp != null ? \" \" + Math.round(state.temp) + \"°F\" : \"\"}${state.weatherIndoor ? \" · INDOOR PICKS\" : \"\"} · tap to override`\n        : \"Couldn't reach the weather — tap to retry / force indoor\";\n    }\n    // indoor banner\n    els.indoorBanner.hidden = !indoorOnly();\n  }\n\n  // tap chip: cycle auto -> indoor -> outdoor -> auto. If weather failed in auto, retry instead.\n  els.weather.addEventListener(\"click\", () => {\n    // always advance the cycle so kids can force indoor/outdoor even if weather never loads\n    state.override = state.override === \"auto\" ? \"indoor\"\n                   : state.override === \"indoor\" ? \"outdoor\"\n                   : \"auto\";\n    // if we land back on auto and weather never loaded, kick a fresh retry in the background\n    if (state.override === \"auto\" && !state.weatherOk) fetchWeather();\n    renderWeather();\n    // tiny pop\n    els.weather.style.transition = \"transform .12s ease\";\n    els.weather.style.transform = \"rotate(2deg) scale(1.12)\";\n    setTimeout(() => { els.weather.style.transform = \"rotate(2deg) scale(1)\"; }, 130);\n  });\n\n  // ---------- PICK ACTIVITY ----------\n  function pool() {\n    let list;\n    if (state.kid === \"either\") {\n      list = ACTIVITIES.either.slice();\n    } else {\n      list = ACTIVITIES[state.kid].slice();\n    }\n    if (indoorOnly()) {\n      list = list.filter(a => a.tag !== \"outdoor\");\n    }\n    return list;\n  }\n\n  function pickActivity() {\n    const list = pool();\n    if (!list.length) return null;\n    // avoid immediate repeat\n    let idx;\n    let tries = 0;\n    do {\n      idx = Math.floor(Math.random() * list.length);\n      tries++;\n    } while (list.length > 1 && idx === state.lastIdx[state.kid] && tries < 8);\n    state.lastIdx[state.kid] = idx;\n    return list[idx];\n  }\n\n  function renderActivity(a) {\n    if (!a) return;\n    els.cTitle.textContent = a.t;\n    els.cBlurb.textContent = a.b;\n    els.cEmoji.textContent = a.e;\n\n    // tag styling\n    const isOut = a.tag === \"outdoor\";\n    els.cTag.textContent = isOut ? \"OUTDOOR\" : (a.tag === \"either\" ? \"ANYWHERE\" : \"INDOOR\");\n    els.cTag.style.background = isOut ? \"var(--lime)\" : (a.tag === \"either\" ? \"var(--sky)\" : \"var(--yellow)\");\n\n    // who line + dot\n    const who = state.kid === \"colin\" ? \"For Colin\"\n              : state.kid === \"miles\" ? \"For Miles\"\n              : \"For both bros\";\n    els.cWho.textContent = who;\n    els.cDot.style.background = state.kid === \"colin\" ? \"var(--colin)\"\n                              : state.kid === \"miles\" ? \"var(--miles)\"\n                              : \"var(--either)\";\n\n    // animate\n    els.card.hidden = false;\n    els.card.classList.remove(\"flip-in\");\n    void els.card.offsetWidth;\n    els.card.classList.add(\"flip-in\");\n    els.reroll.hidden = false;\n  }\n\n  // ---------- CONFETTI ----------\n  const CONFETTI_COLORS = [\"#ffd400\",\"#ff5a5f\",\"#aef359\",\"#4cc9f0\",\"#b07cff\",\"#ff3ea5\",\"#ff8a1f\"];\n  function burst(x, y, count = 28) {\n    const layer = els.confetti;\n    for (let i = 0; i < count; i++) {\n      const c = document.createElement(\"span\");\n      const isStar = Math.random() < .25;\n      const shape = isStar ? \"st\" : (Math.random() < .5 ? \"sq\" : \"ci\");\n      c.className = \"confetti \" + shape;\n      if (!isStar) c.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];\n      else c.style.color = CONFETTI_COLORS[i % CONFETTI_COLORS.length];\n      c.style.left = (x - 7) + \"px\";\n      c.style.top  = (y - 7) + \"px\";\n\n      const angle = Math.random() * Math.PI * 2;\n      const dist  = 80 + Math.random() * 220;\n      const dx = Math.cos(angle) * dist;\n      const dy = Math.sin(angle) * dist - 120; // bias upward\n      const rot = (Math.random() * 720 - 360);\n      const dur = 700 + Math.random() * 700;\n\n      layer.appendChild(c);\n      const anim = c.animate(\n        [\n          { transform: \"translate(0,0) rotate(0deg) scale(1)\", opacity: 1 },\n          { transform: `translate(${dx}px, ${dy + 240}px) rotate(${rot}deg) scale(${.6 + Math.random()*.6})`, opacity: 0 },\n        ],\n        { duration: dur, easing: \"cubic-bezier(.2,.7,.3,1)\", fill: \"forwards\" }\n      );\n      anim.onfinish = () => c.remove();\n    }\n  }\n\n  function burstFromEl(el) {\n    const r = el.getBoundingClientRect();\n    burst(r.left + r.width / 2, r.top + r.height / 2, 36);\n  }\n\n  // ---------- INTERACTIONS ----------\n  function doReveal(originEl) {\n    const a = pickActivity();\n    if (!a) return;\n    renderActivity(a);\n    burstFromEl(originEl);\n    // also hide the float tags after first press so card has the spotlight\n    document.querySelectorAll(\".float-tag\").forEach((t,i) => {\n      t.style.transition = \"opacity .35s ease, transform .35s ease\";\n      t.style.opacity = \".0\";\n      t.style.transform += \" translateY(-20px)\";\n    });\n  }\n\n  els.boredBtn.addEventListener(\"click\", () => {\n    els.boredBtn.classList.remove(\"smash\");\n    void els.boredBtn.offsetWidth;\n    els.boredBtn.classList.add(\"smash\");\n    doReveal(els.boredBtn);\n    // shrink hero a touch after first press so card has room\n    els.boredBtn.style.width = \"min(60vw, 230px)\";\n    els.boredBtn.style.height = \"min(60vw, 230px)\";\n    els.boredBtn.style.fontSize = \"clamp(34px, 10vw, 50px)\";\n  });\n\n  els.reroll.addEventListener(\"click\", () => {\n    doReveal(els.reroll);\n  });\n\n  // ---------- INIT ----------\n  renderWeather();\n  fetchWeather();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
